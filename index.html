<style>
:root{--bg:#0c0c0c;--ink:#f1f1f1;--mute:#a1a1a1;--line:#262626;--acc:#5b7cff;--acc2:#ffb454;--card:#151515;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f0f3f8;--ink:#0f1727;--mute:#58647a;--line:#cdd5e2;--acc:#1f4bff;--acc2:#c76a00;--card:#fbfcfe}}
:root[data-theme="light"]{--bg:#f0f3f8;--ink:#0f1727;--mute:#58647a;--line:#cdd5e2;--acc:#1f4bff;--acc2:#c76a00;--card:#fbfcfe}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px);scroll-behavior:smooth}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.6 "Instrument Sans",system-ui,sans-serif;overflow-x:hidden}
a{color:inherit}
:focus-visible{outline:3px solid var(--acc2);outline-offset:3px}
.wrap{max-width:1080px;margin:0 auto;padding:0 22px}
#bar{position:fixed;top:0;left:0;height:3px;width:0;background:linear-gradient(90deg,var(--acc),var(--acc2));z-index:20}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:60px;gap:12px}
.logo{font:800 18px "Bricolage Grotesque",sans-serif;text-decoration:none}
.logo i{font-style:normal;color:var(--acc2)}
nav{display:flex;align-items:center;gap:18px;font-size:15px}
nav a{text-decoration:none;color:var(--mute)}nav a:hover{color:var(--ink)}
.lang button,.theme{font:500 14px "Instrument Sans",sans-serif;background:none;border:0;color:var(--mute);cursor:pointer;padding:6px}
.lang button[aria-pressed="true"]{color:var(--ink);text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--acc2);text-decoration-thickness:2px}
.cta{background:var(--acc);color:#fff!important;padding:8px 16px;border-radius:999px;font-weight:500}
.hero{padding:88px 22px 64px;position:relative}
.hero::before{content:"";position:absolute;right:-10%;top:10%;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,var(--acc) 0,transparent 68%);opacity:.22;z-index:-1;animation:float 9s ease-in-out infinite alternate}
@keyframes float{to{transform:translate(-40px,30px) scale(1.12)}}
.kick{display:inline-flex;align-items:center;gap:10px;font-size:15px;color:var(--mute);margin-bottom:22px}
.kick b{width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 0 #3ddc8499;animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 10px #3ddc8400}100%{box-shadow:0 0 0 0 #3ddc8400}}
h1{font:800 clamp(50px,12.5vw,150px)/.9 "Bricolage Grotesque",sans-serif;letter-spacing:-.04em;margin:0 0 28px}
h1 .l{display:block;overflow:hidden;padding-bottom:.06em}
h1 .l span{display:block;transform:translateY(105%);animation:up .9s cubic-bezier(.2,.8,.2,1) forwards}
h1 .l:nth-child(2) span{animation-delay:.15s;color:var(--acc)}
@keyframes up{to{transform:none}}
.role{font:500 clamp(20px,3.4vw,30px)/1.3 "Bricolage Grotesque",sans-serif;min-height:1.4em;margin:0 0 18px}
.role .cur{display:inline-block;width:3px;height:1em;background:var(--acc2);vertical-align:-.12em;margin-left:3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hero p.i{max-width:56ch;font-size:19px;color:var(--mute);margin:0 0 30px}
.hero p.i b{color:var(--ink);font-weight:500}
.btns{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-block;text-decoration:none;padding:13px 22px;border-radius:12px;font-weight:500;border:1.5px solid var(--line);background:none;color:var(--ink);cursor:pointer;font:500 16px "Instrument Sans",sans-serif;transition:transform .2s,border-color .2s}
.btn:hover{transform:translateY(-3px);border-color:var(--acc)}
.btn.p{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin-top:56px;padding-top:28px;border-top:1px solid var(--line)}
.stats strong{display:block;font:800 40px "Bricolage Grotesque",sans-serif;color:var(--acc2)}
.stats span{color:var(--mute);font-size:15px}
section{padding:72px 0;border-top:1px solid var(--line)}
h2{font:800 clamp(30px,5vw,48px)/1.1 "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;margin:0 0 34px}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s,transform .7s}
.rv.on{opacity:1;transform:none}
.about{display:grid;grid-template-columns:1.3fr 1fr;gap:40px;align-items:start}
.about p{margin:0 0 14px;color:var(--mute);max-width:60ch}
.about p b{color:var(--ink);font-weight:500}
.facts{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px}
.facts div{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:16px}
.facts div:last-child{border:0}.facts span{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:18px}
.skill{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;transition:transform .25s,border-color .25s}
.skill:hover{transform:translateY(-6px);border-color:var(--acc)}
.skill h3{margin:0 0 6px;font:500 20px "Bricolage Grotesque",sans-serif}
.skill p{margin:0;color:var(--mute);font-size:16px}
.bars{margin-top:34px;display:grid;gap:14px;max-width:640px}
.bar{font-size:15px}.bar div{display:flex;justify-content:space-between;margin-bottom:6px}
.bar i{display:block;height:8px;border-radius:9px;background:var(--line);overflow:hidden}
.bar i::after{content:"";display:block;height:100%;width:0;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2));transition:width 1.3s cubic-bezier(.2,.8,.2,1)}
.on .bar i::after,.bar.on i::after{width:var(--w)}
.proj{display:grid;grid-template-columns:150px 1fr;gap:22px;padding:28px 0;border-bottom:1px solid var(--line)}
.tag{font-size:14px;color:var(--acc2);font-weight:500}
.proj h3{margin:0 0 8px;font:800 24px "Bricolage Grotesque",sans-serif}
.proj p{margin:0 0 10px;max-width:62ch;color:var(--mute)}
.stack{font-size:14px}
.proj a.go{display:inline-block;margin-top:8px;color:var(--acc);font-weight:500;text-underline-offset:4px}
.proj{grid-template-columns:230px 1fr!important;align-items:start}
.pic{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card);aspect-ratio:22/15}
.pic svg{display:block;width:100%;height:100%;transition:transform .5s}
.proj:hover .pic svg{transform:scale(1.07)}
.proj .tag{margin-bottom:4px}
.tl{border-left:2px solid var(--line);margin-left:6px}
.tl>div{position:relative;padding:0 0 28px 26px}
.tl>div::before{content:"";position:absolute;left:-7px;top:7px;width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 4px var(--bg)}
.tl h3{margin:0;font:500 20px "Bricolage Grotesque",sans-serif}
.tl small{color:var(--acc2);font-size:14px;font-weight:500}
.tl p{margin:4px 0 0;color:var(--mute);max-width:62ch;font-size:16px}
.cv{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px}
.cvtop{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px}
.cvtop p{margin:0;color:var(--mute);font-size:15px}
#cvbox{max-height:640px;overflow:auto;border-radius:10px;background:#d9dde6;padding:10px}
#cvbox .pg{position:relative;margin:0 auto 10px;box-shadow:0 2px 10px #0003}#cvbox canvas{display:block;width:100%;height:auto;background:#fff}#cvbox .pg a{position:absolute;display:block;cursor:pointer;border-radius:3px}#cvbox .pg a:hover,#cvbox .pg a:focus-visible{background:#1f4bff22}
#cvmsg{padding:30px;text-align:center;color:#334}
.contact a.big{display:inline-block;font:800 clamp(22px,5vw,46px) "Bricolage Grotesque",sans-serif;letter-spacing:-.02em;text-decoration-color:var(--acc2);text-decoration-thickness:3px;text-underline-offset:8px;word-break:break-word;margin-bottom:22px}
.links{display:flex;flex-wrap:wrap;gap:12px}
footer{padding:30px 0;border-top:1px solid var(--line);color:var(--mute);font-size:14px}
@media(max-width:700px){nav a.hide{display:none}.hero{padding:52px 22px 44px}.about{grid-template-columns:1fr}.proj{grid-template-columns:1fr!important;gap:14px}section{padding:52px 0}.btn{flex:1 1 100%;text-align:center}#cvbox{max-height:520px}}
@media(max-width:700px){
 body{font-size:16px}
 .hero p.i{font-size:17px}
 .stats{grid-template-columns:1fr 1fr;gap:22px 16px;margin-top:40px}
 .stats strong{font-size:34px}
 .pic{aspect-ratio:16/10}
 .lang button,.theme{padding:10px 8px}
 .facts div{flex-direction:column;gap:2px}
 .cvtop{flex-direction:column;align-items:stretch}
 .cvtop .btns{width:100%}
 #cvbox{padding:6px}
 .tl>div{padding-left:20px}
}
@media(max-width:380px){
 .wrap{padding:0 16px}
 .hero{padding-left:16px;padding-right:16px}
 nav{gap:6px}
 .cta{padding:8px 12px;font-size:14px}
 .logo{font-size:16px}
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}h1 .l span{transform:none}html{scroll-behavior:auto}.bar i::after{width:var(--w)}}
</style>
</head>
<body>
